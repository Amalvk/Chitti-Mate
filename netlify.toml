[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  # These are Vite VITE_-prefixed vars, which are intentionally inlined into
  # the client-side JS bundle at build time (Firebase web config — public by
  # design, not a secret; Firebase's real access control is Firestore
  # Security Rules, not hiding this key). Netlify's secret scanner would
  # otherwise fail the build on finding them in the compiled output.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
